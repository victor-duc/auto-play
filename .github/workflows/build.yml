name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AutoPlay.slnx

      - name: Build
        run: dotnet build AutoPlay.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AutoPlay.slnx --configuration Release --no-build
